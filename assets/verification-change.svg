<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="820" viewBox="0 0 1000 820"><title id="title">Challenge the plan, implementation and verification</title><desc id="desc">Independent challenge covers the plan, implementation and verification. Changes to verification are proposed, compared against protected evidence, independently authorized, staged and observed. The organization retains adoption and release authority.</desc><rect width="1000" height="820" fill="#F7F5F0" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62665d" opacity=".58" /></marker></defs><text x="25" y="32" font-family="Arial,sans-serif" font-size="14" fill="#655394" font-weight="700">INDEPENDENT CHALLENGE</text><text x="25" y="72" font-family="Arial,sans-serif" font-size="32" fill="#242721" font-weight="700">Challenge the work. Challenge the checks.</text><rect x="25" y="125" width="300" height="125" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="41" y="155" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Plan</text><text x="41" y="191" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Intent, assumptions, acceptance</text><rect x="350" y="125" width="300" height="125" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="366" y="155" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Implementation</text><text x="366" y="191" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Behavior, impact, failure modes</text><rect x="675" y="125" width="300" height="125" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="691" y="155" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Verification</text><text x="691" y="191" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Missing cases, weakened checks</text><text x="25" y="278" font-family="Arial,sans-serif" font-size="18" fill="#398166" font-weight="400">Callable context + review tools</text><rect x="25" y="295" width="950" height="305" rx="7" fill="#f8f1e5" stroke="#cdb487" stroke-width="1.5" /><text x="42" y="325" font-family="Arial,sans-serif" font-size="17" fill="#94672e" font-weight="700">VERIFICATION-CHANGE GATE</text><rect x="45" y="355" width="215" height="130" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="57" y="380" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Propose a version</text><text x="57" y="435" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Checks + rationale</text><path d="M260 420 L278 420" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="280" y="355" width="215" height="130" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="292" y="380" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Compare evidence</text><text x="292" y="435" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Valid + known-bad cases</text><path d="M495 420 L513 420" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="515" y="355" width="215" height="130" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="527" y="380" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Authorize adoption</text><text x="527" y="435" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Independent rights +</text><text x="527" y="459" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">policy</text><path d="M730 420 L748 420" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="750" y="355" width="215" height="130" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="762" y="380" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Stage and observe</text><text x="762" y="435" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">Compare verdicts; hold /</text><text x="762" y="459" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">restore</text><text x="45" y="530" font-family="Arial,sans-serif" font-size="17" fill="#94672e" font-weight="700">Protected reference evidence</text><text x="45" y="563" font-family="Arial,sans-serif" font-size="18" fill="#62665d" font-weight="400">Original failures · held-out cases · intent + contracts</text><rect x="25" y="635" width="950" height="65" rx="7" fill="#edf3f5" stroke="#afc6ce" stroke-width="1.5" /><text x="42" y="665" font-family="Arial,sans-serif" font-size="20" fill="#242721" font-weight="700">Shared services</text><text x="42" y="685" font-family="Arial,sans-serif" font-size="19" fill="#4d7888" font-weight="400">Context · standards · review evidence</text><text x="25" y="740" font-family="Arial,sans-serif" font-size="19" fill="#62665d" font-weight="400">Review agents · Callable tools · Shared services</text><text x="25" y="775" font-family="Arial,sans-serif" font-size="17" fill="#62665d" font-weight="400">An architectural proposal for software factories.</text><text x="25" y="804" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="400">The organization owns adoption and release authority.</text></svg>