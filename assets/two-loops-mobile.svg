<svg xmlns="http://www.w3.org/2000/svg" width="450" height="770" viewBox="0 0 450 770" role="img" aria-labelledby="title desc">
  <title id="title">Two connected software-factory loops</title>
  <desc id="desc">Human authority governs delivery and factory improvement. Intent becomes a candidate, verification, and an authorized release. Production evidence feeds the next intent. An improvement loop observes, proposes, independently evaluates and rolls out changes to the factory. Both share versioned evidence.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#62665d" opacity=".65"/></marker></defs>
  <rect width="450" height="770" fill="#eeece5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#242721">
    <text x="25" y="34" font-size="11" letter-spacing="1.5" fill="#62665d">THE SOFTWARE FACTORY / TWO JOBS</text>
    <rect x="25" y="55" width="400" height="80" rx="4" fill="#fffefa" stroke="#d5d7cd"/>
    <text x="45" y="86" font-size="21" font-weight="600">Human authority</text>
    <text x="45" y="112" font-size="16" fill="#62665d">Goals · boundaries · permissions</text>
    <path d="M225 135V165" stroke="#62665d" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <rect x="25" y="168" width="400" height="293" rx="4" fill="#f7f5f0" stroke="#c2b9d3"/>
    <text x="45" y="198" font-size="12" letter-spacing="1" fill="#655394">01 / DELIVER USEFUL SOFTWARE</text>
    <g fill="#fffefa" stroke="#d5d7cd"><rect x="55" y="219" width="280" height="43" rx="3"/><rect x="55" y="282" width="280" height="43" rx="3"/><rect x="55" y="345" width="280" height="43" rx="3"/></g>
    <g font-size="19" text-anchor="middle"><text x="195" y="247">Intent → candidate</text><text x="195" y="310">Verify</text><text x="195" y="373">Authorize / release</text></g>
    <g stroke="#62665d" fill="none" marker-end="url(#arrow)"><path d="M195 262V282"/><path d="M195 325V345"/><path d="M335 367H375V241H335"/></g>
    <text x="55" y="423" font-size="15" fill="#62665d">Production evidence → next intent</text>
    <path d="M225 461V493" stroke="#62665d" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="25" y="496" width="400" height="173" rx="4" fill="#fffefa" stroke="#a4b9a9"/>
    <text x="45" y="526" font-size="12" letter-spacing="1" fill="#35614a">02 / IMPROVE THE FACTORY</text>
    <text x="45" y="556" font-size="18">Observe → propose</text>
    <text x="45" y="584" font-size="18">Independent evaluation → rollout</text>
    <text x="45" y="617" font-size="15" fill="#62665d">Rules · skills · policies</text>
    <text x="45" y="643" font-size="15" fill="#62665d">Agents · tools · infrastructure</text>
    <text x="225" y="712" text-anchor="middle" font-size="15" fill="#62665d">Shared evidence: intent + exact versions</text>
    <text x="225" y="738" text-anchor="middle" font-size="15" fill="#62665d">+ verification + authorized actions</text>
  </g>
</svg>
