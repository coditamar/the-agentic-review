<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="450" height="1110" viewBox="0 0 450 1110"><title id="title">Challenge the plan, implementation and verification</title><desc id="desc">Independent challenge covers the plan, implementation and verification. Changes to verification are proposed, compared against protected evidence, independently authorized, staged and observed. The organization retains adoption and release authority.</desc><rect width="450" height="1110" fill="#F7F5F0" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62665d" opacity=".58" /></marker></defs><text x="25" y="32" font-family="Arial,sans-serif" font-size="14" fill="#655394" font-weight="700">INDEPENDENT CHALLENGE</text><text x="25" y="72" font-family="Arial,sans-serif" font-size="24" fill="#242721" font-weight="700">Challenge the work. Challenge the</text><text x="25" y="103" font-family="Arial,sans-serif" font-size="24" fill="#242721" font-weight="700">checks.</text><rect x="25" y="112" width="400" height="87" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="41" y="142" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Plan</text><text x="41" y="178" font-family="Arial,sans-serif" font-size="16" fill="#62665d" font-weight="400">Intent, assumptions, acceptance</text><rect x="25" y="217" width="400" height="87" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="41" y="247" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Implementation</text><text x="41" y="283" font-family="Arial,sans-serif" font-size="16" fill="#62665d" font-weight="400">Behavior, impact, failure modes</text><rect x="25" y="322" width="400" height="87" rx="7" fill="#fffefa" stroke="#bcb1d7" stroke-width="1.5" /><text x="41" y="352" font-family="Arial,sans-serif" font-size="22" fill="#242721" font-weight="700">Verification</text><text x="41" y="388" font-family="Arial,sans-serif" font-size="16" fill="#62665d" font-weight="400">Missing cases, weakened checks</text><text x="25" y="432" font-family="Arial,sans-serif" font-size="14" fill="#398166" font-weight="400">Callable context + review tools</text><rect x="25" y="445" width="400" height="425" rx="7" fill="#f8f1e5" stroke="#cdb487" stroke-width="1.5" /><text x="42" y="475" font-family="Arial,sans-serif" font-size="17" fill="#94672e" font-weight="700">VERIFICATION-CHANGE GATE</text><rect x="45" y="495" width="360" height="64" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="57" y="520" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Propose a version</text><text x="57" y="545" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Checks + rationale</text><path d="M225.0 559 L225.0 571" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="45" y="572" width="360" height="64" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="57" y="597" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Compare evidence</text><text x="57" y="622" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Valid + known-bad cases</text><path d="M225.0 636 L225.0 648" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="45" y="649" width="360" height="64" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="57" y="674" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Authorize adoption</text><text x="57" y="699" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Independent rights + policy</text><path d="M225.0 713 L225.0 725" stroke="#62665d" fill="none" stroke-width="1.5" marker-end="url(#arrow)" /><rect x="45" y="726" width="360" height="64" rx="7" fill="#fffefa" stroke="#ddc7a4" stroke-width="1.5" /><text x="57" y="751" font-family="Arial,sans-serif" font-size="18" fill="#242721" font-weight="700">Stage and observe</text><text x="57" y="776" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Compare verdicts; hold / restore</text><text x="45" y="825" font-family="Arial,sans-serif" font-size="17" fill="#94672e" font-weight="700">Protected reference evidence</text><text x="45" y="850" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Original failures · held-out cases · intent + contracts</text><rect x="25" y="900" width="400" height="95" rx="7" fill="#edf3f5" stroke="#afc6ce" stroke-width="1.5" /><text x="42" y="930" font-family="Arial,sans-serif" font-size="20" fill="#242721" font-weight="700">Shared services</text><text x="42" y="965" font-family="Arial,sans-serif" font-size="16" fill="#4d7888" font-weight="400">Context · standards · review evidence</text><text x="25" y="1028" font-family="Arial,sans-serif" font-size="15" fill="#62665d" font-weight="400">Review agents · Callable tools · Shared services</text><text x="25" y="1063" font-family="Arial,sans-serif" font-size="14" fill="#62665d" font-weight="400">An architectural proposal for software factories.</text><text x="25" y="1092" font-family="Arial,sans-serif" font-size="14" fill="#242721" font-weight="400">The organization owns adoption and release authority.</text></svg>